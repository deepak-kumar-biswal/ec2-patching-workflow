AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Patching Orchestrator - SSM Custom Documents

Parameters:
  NamePrefix:
    Type: String
  Environment:
    Type: String
  SnapshotsBucket:
    Type: String

Resources:
  WindowsCustomPatchDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: JSON
      Name: !Sub '${NamePrefix}-${Environment}-WindowsCustomPatch'
      Content: !Sub |
        {"schemaVersion":"2.2","description":"Custom Windows Patching Document with Pre/Post Operations","parameters":{"Operation":{"type":"String","description":"The update operation to perform on the instance","allowedValues":["Install","Scan"],"default":"Install"},"RebootOption":{"type":"String","description":"Reboot behavior after a patch Install operation","allowedValues":["NoReboot","RebootIfNeeded"],"default":"RebootIfNeeded"},"IncludeKbs":{"type":"String","description":"Comma-separated list of KBs to include (optional)","default":"","allowedPattern":"^$|^KB[0-9]{6,7}(,KB[0-9]{6,7})*$"},"ExcludeKbs":{"type":"String","description":"Comma-separated list of KBs to exclude (optional)","default":"","allowedPattern":"^$|^KB[0-9]{6,7}(,KB[0-9]{6,7})*$"},"ServiceNames":{"type":"StringList","description":"List of services to stop before patching","default":["MyCustomApp","WebService"]},"BackupLocation":{"type":"String","description":"S3 location for configuration backups","default":"${SnapshotsBucket}/windows-configs/"},"MaintenanceMode":{"type":"String","description":"Enable maintenance mode notifications","allowedValues":["true","false"],"default":"true"}},"mainSteps":[{"action":"aws:runPowerShellScript","name":"PrePatchOperations","inputs":{"timeoutSeconds":"1800","runCommand":["# Pre-patch operations","Write-Output 'Starting pre-patch operations...'","","# Enable maintenance mode","if ('{{ MaintenanceMode }}' -eq 'true') {","    Write-Output 'Enabling maintenance mode...'","    # Add your maintenance mode logic here","}","","# Stop specified services","$servicesToStop = @('{{ ServiceNames }}'.Split(','))","foreach ($service in $servicesToStop) {","    if ($service.Trim() -ne '') {","        Write-Output \"Stopping service: $($service.Trim())\"","        try {","            Stop-Service -Name $service.Trim() -Force -ErrorAction Stop","            Write-Output \"Successfully stopped $($service.Trim())\"","        } catch {","            Write-Warning \"Failed to stop service $($service.Trim()): $($_.Exception.Message)\"","        }","    }","}","","# Create system backup","Write-Output 'Creating system state backup...'","$backupPath = '{{ BackupLocation }}' + $env:COMPUTERNAME + '/' + (Get-Date -Format 'yyyy-MM-dd-HH-mm-ss')","Write-Output \"Backup path: $backupPath\"","","# Export registry keys","$tempBackupDir = 'C:\\temp\\patch-backup'","if (!(Test-Path $tempBackupDir)) { New-Item -ItemType Directory -Path $tempBackupDir -Force }","reg export HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall \"$tempBackupDir\\installed-programs.reg\" /y","reg export HKLM\\SYSTEM\\CurrentControlSet\\Services \"$tempBackupDir\\services.reg\" /y","","Write-Output 'Pre-patch operations completed successfully'"]}},{"action":"aws:runPowerShellScript","name":"WindowsPatching","inputs":{"timeoutSeconds":"7200","runCommand":["# Windows patching with custom parameters","Write-Output 'Starting Windows patching operation...'","","$operation = '{{ Operation }}'","$rebootOption = '{{ RebootOption }}'","$includeKbs = '{{ IncludeKbs }}'","$excludeKbs = '{{ ExcludeKbs }}'","","Write-Output \"Operation: $operation\"","Write-Output \"Reboot Option: $rebootOption\"","Write-Output \"Include KBs: $includeKbs\"","Write-Output \"Exclude KBs: $excludeKbs\"","","# Install PSWindowsUpdate module if not present","if (!(Get-Module -ListAvailable -Name PSWindowsUpdate)) {","    Write-Output 'Installing PSWindowsUpdate module...'","    Install-PackageProvider -Name NuGet -Force -Scope CurrentUser","    Install-Module -Name PSWindowsUpdate -Force -Scope CurrentUser","}","","Import-Module PSWindowsUpdate","","# Build update criteria","$updateParams = @{}","if ($includeKbs -ne '') {","    $kbList = $includeKbs.Split(',') | ForEach-Object { $_.Trim() }","    $updateParams['KBArticleID'] = $kbList","}","","# Get available updates","Write-Output 'Scanning for available updates...'","$updates = Get-WUList @updateParams","","if ($excludeKbs -ne '') {","    $excludeList = $excludeKbs.Split(',') | ForEach-Object { $_.Trim() }","    $updates = $updates | Where-Object { $_.KBArticleIDs -notcontains $excludeList }","}","","Write-Output \"Found $($updates.Count) updates to process\"","","if ($operation -eq 'Scan') {","    Write-Output 'Scan mode - listing available updates:'","    $updates | ForEach-Object {","        Write-Output \"- $($_.Title) (KB$($_.KBArticleIDs -join ', KB'))\"","    }","} else {","    Write-Output 'Installing updates...'","    $installParams = @{","        AcceptAll = $true","        IgnoreReboot = ($rebootOption -eq 'NoReboot')","        Verbose = $true","    }","    ","    if ($includeKbs -ne '') {","        $installParams['KBArticleID'] = $kbList","    }","    ","    Install-WindowsUpdate @installParams","}","","Write-Output 'Windows patching operation completed'"]}},{"action":"aws:runPowerShellScript","name":"PostPatchOperations","inputs":{"timeoutSeconds":"1800","runCommand":["# Post-patch operations","Write-Output 'Starting post-patch operations...'","","# Wait for system stability","Start-Sleep -Seconds 30","","# Start previously stopped services","$servicesToStart = @('{{ ServiceNames }}'.Split(','))","foreach ($service in $servicesToStart) {","    if ($service.Trim() -ne '') {","        Write-Output \"Starting service: $($service.Trim())\"","        try {","            Start-Service -Name $service.Trim() -ErrorAction Stop","            Write-Output \"Successfully started $($service.Trim())\"","        } catch {","            Write-Warning \"Failed to start service $($service.Trim()): $($_.Exception.Message)\"","        }","    }","}","","# Verify system health","Write-Output 'Performing post-patch health checks...'","","# Check Windows Update status","$updateSession = New-Object -ComObject Microsoft.Update.Session","$updateSearcher = $updateSession.CreateUpdateSearcher()","$pendingUpdates = $updateSearcher.Search('IsInstalled=0')","Write-Output \"Pending updates after patching: $($pendingUpdates.Updates.Count)\"","","# Check system uptime","$uptime = (Get-Date) - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime","Write-Output \"System uptime: $($uptime.Days) days, $($uptime.Hours) hours, $($uptime.Minutes) minutes\"","","# Check critical services","$criticalServices = @('Winmgmt', 'RpcSs', 'BITS', 'wuauserv')","foreach ($service in $criticalServices) {","    $serviceStatus = Get-Service -Name $service","    Write-Output \"Service $service status: $($serviceStatus.Status)\"","}","","# Disable maintenance mode","if ('{{ MaintenanceMode }}' -eq 'true') {","    Write-Output 'Disabling maintenance mode...'","    # Add your maintenance mode disable logic here","}","","# Generate summary report","Write-Output '=== POST-PATCH SUMMARY ==='","Write-Output \"Computer: $env:COMPUTERNAME\"","Write-Output \"Patch Date: $(Get-Date)\"","Write-Output \"Reboot Required: $((Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\WindowsUpdate\\Auto Update\\RebootRequired' -ErrorAction SilentlyContinue) -ne $null)\"","","Write-Output 'Post-patch operations completed successfully'"]}}]}
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-${Environment}-WindowsCustomPatch'
        - Key: Environment
          Value: !Ref Environment

  LinuxCustomPatchDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: JSON
      Name: !Sub '${NamePrefix}-${Environment}-LinuxCustomPatch'
      Content: !Sub |
        {"schemaVersion":"2.2","description":"Custom Linux Patching Document with Pre/Post Operations","parameters":{"Operation":{"type":"String","description":"The update operation to perform on the instance","allowedValues":["Install","Scan"],"default":"Install"},"RebootOption":{"type":"String","description":"Reboot behavior after a patch Install operation","allowedValues":["NoReboot","RebootIfNeeded"],"default":"RebootIfNeeded"},"PackageNames":{"type":"StringList","description":"Specific packages to update (leave empty for all)","default":[]},"ExcludePackages":{"type":"StringList","description":"Packages to exclude from updates","default":[]},"ServiceNames":{"type":"StringList","description":"Services to stop before patching","default":["httpd","nginx","myapp"]},"BackupLocation":{"type":"String","description":"S3 location for configuration backups","default":"${SnapshotsBucket}/linux-configs/"},"MaintenanceMode":{"type":"String","description":"Enable maintenance mode notifications","allowedValues":["true","false"],"default":"true"}},"mainSteps":[{"action":"aws:runShellScript","name":"PrePatchOperations","inputs":{"timeoutSeconds":"1800","runCommand":["#!/bin/bash","set -e","","echo 'Starting pre-patch operations...'","","# Enable maintenance mode","if [[ '{{ MaintenanceMode }}' == 'true' ]]; then","    echo 'Enabling maintenance mode...'","    # Add your maintenance mode logic here","    touch /tmp/maintenance-mode","fi","","# Stop specified services","IFS=',' read -ra SERVICES <<< '{{ ServiceNames }}'","for service in \"${SERVICES[@]}\"; do","    service=$(echo \"$service\" | xargs)  # trim whitespace","    if [[ -n \"$service\" ]]; then","        echo \"Stopping service: $service\"","        if systemctl is-active --quiet \"$service\"; then","            systemctl stop \"$service\" || echo 'Warning: Failed to stop' \"$service\"","            echo \"Successfully stopped $service\"","        else","            echo \"Service $service is not running\"","        fi","    fi","done","","# Create system backup","echo 'Creating system configuration backup...'","BACKUP_DIR=\"/tmp/patch-backup-$(date +%Y%m%d-%H%M%S)\"","mkdir -p \"$BACKUP_DIR\"","","# Backup critical configurations","cp /etc/fstab \"$BACKUP_DIR/\" 2>/dev/null || echo 'Warning: Could not backup fstab'","cp -r /etc/systemd/system \"$BACKUP_DIR/systemd-system\" 2>/dev/null || echo 'Warning: Could not backup systemd configs'","cp /etc/hosts \"$BACKUP_DIR/\" 2>/dev/null || echo 'Warning: Could not backup hosts file'","","# Backup package list","if command -v dpkg > /dev/null; then","    dpkg -l > \"$BACKUP_DIR/package-list.txt\"","elif command -v rpm > /dev/null; then","    rpm -qa > \"$BACKUP_DIR/package-list.txt\"","fi","","# Create archive and upload to backup location if configured","BACKUP_LOCATION='{{ BackupLocation }}'","if [[ -n \"$BACKUP_LOCATION\" ]]; then","    tar -czf \"$BACKUP_DIR.tar.gz\" -C \"/tmp\" \"$(basename \"$BACKUP_DIR\")\" || echo 'Warning: Backup archive creation failed'","fi","","echo 'Pre-patch operations completed successfully'"]}},{"action":"aws:runShellScript","name":"LinuxPatching","inputs":{"timeoutSeconds":"7200","runCommand":["#!/bin/bash","set -e","","echo 'Starting Linux patching operation...'","","OPERATION='{{ Operation }}'","REBOOT_OPTION='{{ RebootOption }}'","PACKAGE_NAMES='{{ PackageNames }}'","EXCLUDE_PACKAGES='{{ ExcludePackages }}'","","echo \"Operation: $OPERATION\"","echo \"Reboot Option: $REBOOT_OPTION\"","echo \"Package Names: $PACKAGE_NAMES\"","echo \"Exclude Packages: $EXCLUDE_PACKAGES\"","","# Detect package manager","if command -v yum > /dev/null; then","    PKG_MGR='yum'","elif command -v dnf > /dev/null; then","    PKG_MGR='dnf'","elif command -v apt-get > /dev/null; then","    PKG_MGR='apt'","elif command -v zypper > /dev/null; then","    PKG_MGR='zypper'","else","    echo 'Error: No supported package manager found'","    exit 1","fi","","echo \"Detected package manager: $PKG_MGR\"","","# Update package repositories","echo 'Updating package repositories...'","case $PKG_MGR in","    yum|dnf)","        $PKG_MGR makecache","        ;;","    apt)","        apt-get update","        ;;","    zypper)","        zypper refresh","        ;;","esac","","if [[ \"$OPERATION\" == 'Scan' ]]; then","    echo 'Scan mode - checking for available updates:'","    case $PKG_MGR in","        yum|dnf)","            $PKG_MGR check-update || true","            ;;","        apt)","            apt list --upgradable","            ;;","        zypper)","            zypper list-updates","            ;; ","    esac","else","    echo 'Installing updates...'","    ","    # Handle specific packages","    if [[ -n \"$PACKAGE_NAMES\" && \"$PACKAGE_NAMES\" != '[]' ]]; then","        # Parse package names from the array format","        PACKAGES=$(echo \"$PACKAGE_NAMES\" | sed 's/\\[//g; s/\\]//g; s/\"//g')","        echo \"Updating specific packages: $PACKAGES\"","        ","        case $PKG_MGR in","            yum|dnf)","                $PKG_MGR update -y $PACKAGES","                ;;","            apt)","                apt-get install --only-upgrade -y $PACKAGES","                ;;","            zypper)","                zypper update -y $PACKAGES","                ;;","        esac","    else","        echo 'Updating all packages...'","        case $PKG_MGR in","            yum|dnf)","                $PKG_MGR update -y","                ;;","            apt)","                DEBIAN_FRONTEND=noninteractive apt-get upgrade -y","                ;;","            zypper)","                zypper update -y","                ;;","        esac","    fi","    ","    # Clean up package cache","    case $PKG_MGR in","        yum|dnf)","            $PKG_MGR clean all","            ;;","        apt)","            apt-get autoremove -y","            apt-get autoclean","            ;;","        zypper)","            zypper clean","            ;;","    esac","fi","","echo 'Linux patching operation completed'"]}},{"action":"aws:runShellScript","name":"PostPatchOperations","inputs":{"timeoutSeconds":"1800","runCommand":["#!/bin/bash","set -e","","echo 'Starting post-patch operations...'","","# Wait for system stability","sleep 30","","# Start previously stopped services","IFS=',' read -ra SERVICES <<< '{{ ServiceNames }}'","for service in \"${SERVICES[@]}\"; do","    service=$(echo \"$service\" | xargs)  # trim whitespace","    if [[ -n \"$service\" ]]; then","        echo \"Starting service: $service\"","        if systemctl is-enabled --quiet \"$service\" 2>/dev/null; then","            systemctl start \"$service\" || echo 'Warning: Failed to start' \"$service\"","            echo \"Successfully started $service\"","        else","            echo \"Service $service is not enabled or does not exist\"","        fi","    fi","done","","# Verify system health","echo 'Performing post-patch health checks...'","","# Check system uptime","uptime","","# Check disk space","df -h","","# Check memory usage","free -h","","# Check critical services","CRITICAL_SERVICES=('sshd' 'systemd-networkd' 'chronyd')","for service in \"${CRITICAL_SERVICES[@]}\"; do","    if systemctl is-active --quiet \"$service\" 2>/dev/null; then","        echo \"Service $service is running\"","    else","        echo \"Warning: Service $service is not running\"","    fi","done","","# Check for pending reboot","REBOOT_REQUIRED=false","if [[ -f /var/run/reboot-required ]]; then","    REBOOT_REQUIRED=true","    echo 'Reboot required flag found: /var/run/reboot-required'","elif [[ -f /var/run/reboot-required.pkgs ]]; then","    REBOOT_REQUIRED=true","    echo 'Reboot required packages found: /var/run/reboot-required.pkgs'","fi","","# Check kernel version","RUNNING_KERNEL=$(uname -r)","if command -v dpkg > /dev/null; then","    INSTALLED_KERNEL=$(dpkg -l 'linux-image-*' | grep '^ii' | tail -1 | awk '{print $2}' | sed 's/linux-image-//')","elif command -v rpm > /dev/null; then","    INSTALLED_KERNEL=$(rpm -q kernel | tail -1 | sed 's/kernel-//')","fi","","if [[ \"$RUNNING_KERNEL\" != \"$INSTALLED_KERNEL\" ]]; then","    echo \"Kernel version mismatch - Running: $RUNNING_KERNEL, Installed: $INSTALLED_KERNEL\"","    REBOOT_REQUIRED=true","fi","","# Disable maintenance mode","if [[ '{{ MaintenanceMode }}' == 'true' ]]; then","    echo 'Disabling maintenance mode...'","    rm -f /tmp/maintenance-mode","fi","","# Generate summary report","echo '=== POST-PATCH SUMMARY ==='","echo \"Hostname: $(hostname)\"","echo \"Patch Date: $(date)\"","echo \"Reboot Required: $REBOOT_REQUIRED\"","echo \"Running Kernel: $RUNNING_KERNEL\"","echo \"System Load: $(uptime | awk -F'load average:' '{print $2}')\"","","echo 'Post-patch operations completed successfully'"]}}]}
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-${Environment}-LinuxCustomPatch'
        - Key: Environment
          Value: !Ref Environment

Outputs:
  WindowsCustomPatchDocumentName:
    Value: !Ref WindowsCustomPatchDocument
  LinuxCustomPatchDocumentName:
    Value: !Ref LinuxCustomPatchDocument
