AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Patching Orchestrator - Hub (Root aggregator using nested stacks)

Parameters:
  NamePrefix:
    Type: String
    Default: ec2-patch
  Environment:
    Type: String
    AllowedValues: [dev, test, stage, prod]
    Default: dev
  WaveMaxConcurrency:
    Type: Number
    Default: 2
  AccountMaxConcurrency:
    Type: Number
    Default: 5
  RegionMaxConcurrency:
    Type: Number
    Default: 3
  SsmMaxConcurrency:
    Type: String
    Default: '10%'
  SsmMaxErrors:
    Type: String
    Default: '1'
  LogRetentionDays:
    Type: Number
    Default: 30
  CrossAccountExternalId:
    Type: String
    Default: ''
    NoEcho: true
  LambdaArtifactBucket:
    Type: String
  LambdaArtifactKey:
    Type: String
  ReservedConcSend:
    Type: Number
    Default: 10
  ReservedConcPoll:
    Type: Number
    Default: 20
  ReservedConcInventory:
    Type: Number
    Default: 5
  ReservedConcPostVerify:
    Type: Number
    Default: 5
  EnableScheduledExecution:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
  PatchingSchedule:
    Type: String
    Default: 'cron(0 2 ? * SUN *)'
  DefaultPatchGroup:
    Type: String
    Default: 'prod-servers'
  NotificationEmail:
    Type: String
    Default: ''
  WindowsPrePatchDocument:
    Type: String
    Default: 'WindowsPrePatch'
  WindowsPatchDocument:
    Type: String
    Default: 'WindowsPatch'
  WindowsPostPatchDocument:
    Type: String
    Default: 'WindowsPostPatch'
  LinuxPrePatchDocument:
    Type: String
    Default: 'LinuxPrePatch'
  LinuxPatchDocument:
    Type: String
    Default: 'LinuxPatch'
  LinuxPostPatchDocument:
    Type: String
    Default: 'LinuxPostPatch'
  SpokeAccountIds:
    Type: CommaDelimitedList
    Default: ''

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]
  HasSpokeAccounts: !Not [!Equals [!Join ["", !Ref SpokeAccountIds], ""]]

Resources:
  CoreStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: cloudformation/nested/hub-core.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        LogRetentionDays: !Ref LogRetentionDays
        NotificationEmail: !Ref NotificationEmail

  LambdasStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: cloudformation/nested/hub-lambdas.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        UnifiedExecutionRoleArn: !GetAtt CoreStack.Outputs.UnifiedExecutionRoleArn
        LambdaArtifactBucket: !Ref LambdaArtifactBucket
        LambdaArtifactKey: !Ref LambdaArtifactKey
        ReservedConcSend: !Ref ReservedConcSend
        ReservedConcPoll: !Ref ReservedConcPoll
        ReservedConcInventory: !Ref ReservedConcInventory
        ReservedConcPostVerify: !Ref ReservedConcPostVerify
        NotificationTopicArn: !If [HasNotificationEmail, !GetAtt CoreStack.Outputs.NotificationTopicArn, '']
        SnapshotsBucket: !GetAtt CoreStack.Outputs.SnapshotsBucketName
        PatchRunsTableName: !GetAtt CoreStack.Outputs.PatchRunsTableName
        WindowsPrePatchDocument: !Ref WindowsPrePatchDocument
        WindowsPatchDocument: !Ref WindowsPatchDocument
        WindowsPostPatchDocument: !Ref WindowsPostPatchDocument
        LinuxPrePatchDocument: !Ref LinuxPrePatchDocument
        LinuxPatchDocument: !Ref LinuxPatchDocument
        LinuxPostPatchDocument: !Ref LinuxPostPatchDocument
    DependsOn: CoreStack

  SsmDocsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: cloudformation/nested/hub-ssm-docs.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        SnapshotsBucket: !GetAtt CoreStack.Outputs.SnapshotsBucketName
    DependsOn: CoreStack

  StateMachineStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: cloudformation/nested/hub-state-machine.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        UnifiedExecutionRoleArn: !GetAtt CoreStack.Outputs.UnifiedExecutionRoleArn
        LogRetentionDays: !Ref LogRetentionDays
        SsmMaxConcurrency: !Ref SsmMaxConcurrency
        SsmMaxErrors: !Ref SsmMaxErrors
        WaveMaxConcurrency: !Ref WaveMaxConcurrency
        AccountMaxConcurrency: !Ref AccountMaxConcurrency
        RegionMaxConcurrency: !Ref RegionMaxConcurrency
        CrossAccountExternalId: !Ref CrossAccountExternalId
        SnapshotsBucket: !GetAtt CoreStack.Outputs.SnapshotsBucketName
        PreEC2InventoryFunctionName: !GetAtt LambdasStack.Outputs.PreEC2InventoryFunctionName
        PollSsmCommandFunctionName: !GetAtt LambdasStack.Outputs.PollSsmCommandFunctionName
        SendSsmCommandFunctionName: !GetAtt LambdasStack.Outputs.SendSsmCommandFunctionName
        PostEC2VerifyFunctionName: !GetAtt LambdasStack.Outputs.PostEC2VerifyFunctionName
    DependsOn:
      - CoreStack
      - LambdasStack

  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: cloudformation/nested/hub-monitoring.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        NotificationTopicArn: !If [HasNotificationEmail, !GetAtt CoreStack.Outputs.NotificationTopicArn, '']
        PatchRunsTableName: !GetAtt CoreStack.Outputs.PatchRunsTableName
        PreEC2InventoryFunctionName: !GetAtt LambdasStack.Outputs.PreEC2InventoryFunctionName
        SendSsmCommandFunctionName: !GetAtt LambdasStack.Outputs.SendSsmCommandFunctionName
        PollSsmCommandFunctionName: !GetAtt LambdasStack.Outputs.PollSsmCommandFunctionName
        PostEC2VerifyFunctionName: !GetAtt LambdasStack.Outputs.PostEC2VerifyFunctionName
        StateMachineArn: !GetAtt StateMachineStack.Outputs.StateMachineArn
    DependsOn:
      - CoreStack
      - LambdasStack
      - StateMachineStack

  ScheduleStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: cloudformation/nested/hub-schedule.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        EnableScheduledExecution: !Ref EnableScheduledExecution
        PatchingSchedule: !Ref PatchingSchedule
        DefaultPatchGroup: !Ref DefaultPatchGroup
        WindowsPrePatchDocument: !Ref WindowsPrePatchDocument
        WindowsPatchDocument: !Ref WindowsPatchDocument
        WindowsPostPatchDocument: !Ref WindowsPostPatchDocument
        LinuxPrePatchDocument: !Ref LinuxPrePatchDocument
        LinuxPatchDocument: !Ref LinuxPatchDocument
        LinuxPostPatchDocument: !Ref LinuxPostPatchDocument
        StateMachineArn: !GetAtt StateMachineStack.Outputs.StateMachineArn
        UnifiedExecutionRoleArn: !GetAtt CoreStack.Outputs.UnifiedExecutionRoleArn
    DependsOn:
      - CoreStack
      - StateMachineStack

  ShareDocsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: cloudformation/nested/hub-share-docs.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        WindowsCustomPatchDocumentName: !GetAtt SsmDocsStack.Outputs.WindowsCustomPatchDocumentName
        LinuxCustomPatchDocumentName: !GetAtt SsmDocsStack.Outputs.LinuxCustomPatchDocumentName
        SpokeAccountIds: !Ref SpokeAccountIds
    DependsOn: SsmDocsStack

Outputs:
  PatchRunsTableName:
    Value: !GetAtt CoreStack.Outputs.PatchRunsTableName
  SnapshotsBucketName:
    Value: !GetAtt CoreStack.Outputs.SnapshotsBucketName
  StateMachineArn:
    Value: !GetAtt StateMachineStack.Outputs.StateMachineArn
  DashboardName:
    Value: !GetAtt MonitoringStack.Outputs.DashboardName
  NotificationTopicArn:
    Condition: HasNotificationEmail
    Value: !GetAtt CoreStack.Outputs.NotificationTopicArn
  WindowsCustomPatchDocumentName:
    Value: !GetAtt SsmDocsStack.Outputs.WindowsCustomPatchDocumentName
  LinuxCustomPatchDocumentName:
    Value: !GetAtt SsmDocsStack.Outputs.LinuxCustomPatchDocumentName
  SharedDocuments:
    Value: !Join
      - ', '
      - - !GetAtt SsmDocsStack.Outputs.WindowsCustomPatchDocumentName
        - !GetAtt SsmDocsStack.Outputs.LinuxCustomPatchDocumentName